apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwt-auth-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jwt-auth-service
  template:
    metadata:
      labels:
        app: jwt-auth-service
    spec:
      containers:
        - name: jwt-auth-service
          image: jwt-auth-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-Xmx256m -Xms128m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jwt-auth-service
spec:
  selector:
    app: jwt-auth-service
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
