server:
  port: 9100

spring:
  application:
    name: JWT-AUTH-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/jwt_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: verysecretkeythatshouldbereplacedveryverylong
  expirationMs: 3600000
