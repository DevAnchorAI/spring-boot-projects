spring.application.name=whatsapp-messenger
server.port=8080
server.servlet.context-path=/

# Optional Config Server import (prevents startup failure when no config server is configured)
# If you run a Spring Cloud Config server, change the URL to that server; 'optional:' ensures startup
spring.config.import=optional:configserver:http://localhost:9192

# Default profile: use 'dev' which uses H2 in-memory DB to make local startup convenient.
# To use MySQL in production, set spring.profiles.active=mysql
spring.profiles.default=local

# You can also disable config client entirely by uncommenting the following line
# spring.cloud.config.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.sks.messenger=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.preferIpAddress=true
eureka.instance.hostname=localhost

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=whatsapp-messenger-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
