spring:
  application:
    name: circuit-breaker-service
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.example.circuitbreaker: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        recordExceptions:
          - java.lang.Exception
        ignoreExceptions:
          - java.lang.NullPointerException
    instances:
      userServiceBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 60
      paymentServiceBreaker:
        baseConfig: default
        waitDurationInOpenState: 15s
        failureRateThreshold: 50
      notificationServiceBreaker:
        baseConfig: default
        waitDurationInOpenState: 5s
        failureRateThreshold: 40

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1000
        retryExceptions:
          - java.net.ConnectException
          - java.io.IOException
        ignoreExceptions:
          - java.lang.NullPointerException
    instances:
      userServiceRetry:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 500
      paymentServiceRetry:
        baseConfig: default
        maxAttempts: 4
        waitDuration: 2000

  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true
    instances:
      userServiceTimeLimiter:
        baseConfig: default
        timeoutDuration: 3s

  # Bulkhead configuration for limiting concurrent calls
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 100
        maxWaitDuration: 10ms
    instances:
      userServiceBulkhead:
        baseConfig: default
        maxConcurrentCalls: 50

  # Thread pool executor configuration
  thread-pool-bulkhead:
    configs:
      default:
        coreThreadPoolSize: 10
        maxThreadPoolSize: 20
        queueCapacity: 100
    instances:
      userServiceThreadPool:
        baseConfig: default
        coreThreadPoolSize: 5
        maxThreadPoolSize: 10

---
# Profile: dev
spring:
  config:
    activate:
      on-profile: dev

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.circuitbreaker: DEBUG

---
# Profile: prod
spring:
  config:
    activate:
      on-profile: prod

server:
  port: 8080

logging:
  level:
    root: WARN
    com.example.circuitbreaker: INFO

resilience4j:
  circuitbreaker:
    instances:
      userServiceBreaker:
        failureRateThreshold: 40
      paymentServiceBreaker:
        failureRateThreshold: 30
