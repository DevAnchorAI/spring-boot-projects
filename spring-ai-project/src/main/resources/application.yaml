spring:
  application:
    name: spring-ai-project
  datasource:
      url: jdbc:postgresql://localhost:5432/ai_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: public
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
      embedding:
        model: mxbai-embed-large
    vectorstore:
      pgvector:
        initialize-schema: true
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: postgresql
    mcp:
      client:
        enabled: true
        name: banking-ai-client
        version: 1.0.0
        type: SYNC

        streamable-http:
          connections:
            banking-server:
              url: http://localhost:8081
              endpoint: /mcp

server:
  port: 8080