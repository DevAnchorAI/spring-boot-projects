# Null Check Agent Configuration Properties
# Configure null pointer detection behavior

# Enable/Disable specific checks
check.method.calls=true
check.field.access=true
check.array.access=true
check.method.chaining=true

# Exclude settings
exclude.tests=true

# Exclude patterns (comma-separated)
# Paths containing these patterns will be excluded from analysis
exclude.patterns=.generated.,target/,build/,out/

# Safe variables (comma-separated)
# These variables won't trigger null pointer warnings
safe.variables=System,log,logger,this,super,env,out,err
