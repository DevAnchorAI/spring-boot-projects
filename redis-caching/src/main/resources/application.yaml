spring:
  application:
    name: redis-caching
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
    cache:
      type: redis
  datasource:
    url: jdbc:mysql://localhost:3306/db_example
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true